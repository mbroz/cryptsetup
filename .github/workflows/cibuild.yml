name: Build test
on:
  push:
    branches:
      - 'main'
      - 'wip-luks2'
      - 'v2.*.x'
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'mbroz/cryptsetup'
    strategy:
      fail-fast: false
      matrix:
        env:
          - { COMPILER: "gcc", COMPILER_VERSION: "15",  RUN_SSH_PLUGIN_TEST: "1" }
    env: ${{ matrix.env }}
    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
      - name: Ubuntu setup
        run: sudo --preserve-env=COMPILER,COMPILER_VERSION,RUN_SSH_PLUGIN_TEST .github/workflows/cibuild-setup-ubuntu.sh
      - name: Configure & Make
        run: .github/workflows/cibuild.sh CONFIGURE MAKE
      - name: Check
        run: sudo --preserve-env=COMPILER,COMPILER_VERSION,RUN_SSH_PLUGIN_TEST .github/workflows/cibuild.sh CHECK
